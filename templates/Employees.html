<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees Dashboard</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #ebebeb;
      color: black;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #410445;
      color: white;
      padding: 20px;
    }

    .menu {
      list-style-type: none;
    }

    .menu li {
      margin-bottom: 20px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 13px;
      border-radius: 8px;
    }

    .menu a:hover,
    .menu a.active {
      background-color: #A5158C;
    }



    .fart {
      list-style-type: none;
      margin-bottom: 20px;
      color: white;
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 13px;
      border-radius: 8px;
    }


    .fart:hover
    {
      background-color: #34495e;
    }

    

    .main {
      flex: 1;
      padding: 30px;
    }

    .part {
      display: none;
    }

    .part.active {
      display: block;
    }

    table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background-color: white;
  border-radius: 10px;
  overflow: hidden;
}

thead {
  background-color: #2c3e50;
  color: white;
}

thead th {
  padding: 15px;
  text-align: left;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

tbody td {
  padding: 15px;
  border-bottom: 1px solid #eaeaea;
  font-size: 15px;
}


</style>
<body>
    <div class="container">
        <div class="sidebar">
          <div style="margin-bottom: 20px; font-size: 20px;">Employees</div>
          <ul class="menu">
            <li><a href="#dashboard" class="active">Dashboard</a></li>
            <li><a href="#employees" onclick="employeeload(); return false;">Coworkers</a></li>
            <li><a href="#forms" onclick="stuff(); return false;">Assigments</a></li>
            <li><a href="#">Logout</a></li>
          </ul>
          <a class="fart" href="{% url 'dashboard' %}">Home</a></li>
        </div>
    
        <div class="main">
          <div id="dashboard" class="part active">
            <h1 id="welcome"></h1>
          </div>
          <div id="employees" class="part">
            <h2>Coworkers</h2>
            <table>
              <thead>
                  <tr>
                      <th>Coworkers Name</th>
                      <th>Coworkers ID</th>
                      <th>Coworkers Email</th>
                      <th>Department</th>
                  </tr>
              </thead>
              <tbody id="employedTableBody"></tbody>
            </table>
          </div>

          <div id="forms" class="part">
             
            <div id="trois-dept" class="">
              <h2>Assigments</h2>
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Date</th>
                    <th>User ID</th>
                    <th>PDF</th>
                    <th>PDF Type</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="troisPendingBody"></tbody>
              </table>
            </div>
          
            <div id="ura-dept" class="">
              <h2>Assigments</h2>
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Date</th>
                    <th>User ID</th>
                    <th>PDF</th>
                    <th>PDF Type</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="uraPendingBody"></tbody>
              </table>
            </div>
      </div>
    </div>
    </div>
</body>
<script>
    const links = document.querySelectorAll('.menu a');
    const contentSections = document.querySelectorAll('.part');

    links.forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();

        const targetId = this.getAttribute('href').substring(1);

        links.forEach(item => item.classList.remove('active'));
        this.classList.add('active');

        contentSections.forEach(section => {
          section.classList.remove('active');
        });

        const targetSection = document.getElementById(targetId);
        if (targetSection) {
          targetSection.classList.add('active');
        }
      });
    });


    document.addEventListener("DOMContentLoaded", function () {
            console.log("Fetching user data...");

            fetch('/api/microsoft-login/', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {

                console.log("Fetched user data:", data);
                if (!localStorage.getItem("access_token")){
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("user", JSON.stringify(data.user)); 
                }

                // Update the UI after data is fetched
                updateUserUI();
                updateUserData();
            })
            .catch(error => {
                //console.error("Error fetching user data:", error);
                updateUserUI();
            });
            updateUserData();
            
       })
        function updateUserUI() {
            console.log("Checking for user data in localStorage...");

            // Try fetching "user_data" first, if not available, fall back to "user"
            let userDataString = localStorage.getItem("user_data") || localStorage.getItem("user");
            
            if (userDataString) {
                try {
                    const userData = JSON.parse(userDataString);
                    if (userData && userData.name) {
                        document.getElementById("welcome").textContent = `Welcome, ${userData.name}!`;
                    }
                } catch (error) {
                    console.error("Error parsing user data:", error);
                }
            } else {
                console.warn("No user data found in localStorage.");
            }
        }


    async function stuff() {
  let currUser = localStorage.getItem("user_data");
  let currUserData = JSON.parse(currUser);
  managerRole = {
    id: '',
    level: '',
    role_name: '',
    department: ''
  }

  if (currUser !== null) {
    console.log("Retrieved value:", currUser);
    console.log("Retrieved value:", currUserData.id);
  } else {
    console.log("No value found for logged in user.");
    return;
  }

  await fetch(`/api/users/${currUserData.id}/`)
    .then(response => response.json())
    .then(data => {
      console.log("Retrieved data:", data.role.department);
      managerRole.id = data.role.id;
      managerRole.level = data.role.level;
      managerRole.role_name = data.role.role_name;
      managerRole.department = data.role.department;
    });

  // Show/hide sections based on department
  if (managerRole.id == 1) {
    document.getElementById("trois-dept").style.display = "block";
    document.getElementById("ura-dept").style.display = "block";
  } else if (managerRole.department === "finance") {
    document.getElementById("trois-dept").style.display = "block";
    document.getElementById("ura-dept").style.display = "none";
  } else {
    document.getElementById("trois-dept").style.display = "none";
    document.getElementById("ura-dept").style.display = "block";
  }

  // Fetch all forms + work assignments
  Promise.all([
    fetch("/api/payroll/").then(r => r.json()),
    fetch("/api/reimburse/").then(r => r.json()),
    fetch("/api/address/").then(r => r.json()),
    fetch("/api/diploma/").then(r => r.json()),
    fetch("/api/work_assignments/").then(r => r.json())
  ])
  .then(([payrollData, reimburseData, addressData, diplomaData, assignments]) => {
    const troisPending = document.getElementById('troisPendingBody');
    const uraPending = document.getElementById('uraPendingBody');

    // Clear existing
    troisPending.innerHTML = '';
    uraPending.innerHTML = '';
    

    // Filter assignments by current user
    const assignedToMe = assignments.filter(a => a.user_id === currUserData.id);

    // Gather form objects from assignments
    const myForms = [];

    assignedToMe.forEach(assign => {
      let form = null;
      if (assign.PayrollAssignment_id_id) {
        form = payrollData.find(f => f.id === assign.PayrollAssignment_id_id);
        if (form) form.type = "Payroll";
      } else if (assign.ReimbursementRequest_id_id) {
        form = reimburseData.find(f => f.id === assign.ReimbursementRequest_id_id);
        if (form) form.type = "Reimbursement";
      } else if (assign.ChangeOfAddress_id_id) {
        form = addressData.find(f => f.id === assign.ChangeOfAddress_id_id);
        if (form) form.type = "Change of Address";
      } else if (assign.DiplomaRequest_id_id) {
        form = diplomaData.find(f => f.id === assign.DiplomaRequest_id_id);
        if (form) form.type = "Diploma Request";
      }

      if (form) {
        form.assignment_status = assign.status;
        form.assignment_deadline = assign.deadline;
        myForms.push(form);
      }
    });
    const toyForms = myForms.filter(f => f.type === "Payroll" || f.type === "Reimbursement");
    const umpForms = myForms.filter(f => f.type === "Change of Address" || f.type === "Diploma Request");


    const sortByDate = (a, b) => 
      new Date(b.date_submitted || b.todays_date || b.today_date) -
      new Date(a.date_submitted || a.todays_date || a.today_date);

    const toyPending = toyForms.filter(f => f.assignment_status === "Pending").sort(sortByDate);
    const umpPending = umpForms.filter(f => f.assignment_status === "Pending").sort(sortByDate);



    renderForms(toyPending, troisPending);
    renderForms(umpPending, uraPending);
  })
  .catch(error => console.error("Error loading forms:", error));
}


function renderForms(dataArray, tbody) {
      dataArray.forEach(form => {
        let formType = "Unknown";
        let viewUrl = "";
        let deleteHandler = "";
        let selectId = "";

        if (form.todays_date) {
          formType = "Payroll Form";
          viewUrl = `/view_payroll_pdf2/${form.id}/`;
          deleteHandler = `deleteForm(${form.id}, 'payroll')`;
          selectId = `statusSelect_payroll_${form.id}`;
        } else if (form.today_date) {
          formType = "Reimburse Form";
          viewUrl = `/view_pdf2/${form.id}/`;
          deleteHandler = `deleteForm(${form.id}, 'reimburse')`;
          selectId = `statusSelect_reimburse_${form.id}`;
        } else if ('street_address' in form) {
          formType = "Change Address Form";
          viewUrl = `/view_change_address_pdf3/${form.id}/`;
          deleteHandler = `deleteForm(${form.id}, 'address')`;
          selectId = `statusSelect_address_${form.id}`;
        } else if ('degree' in form) {
          formType = "Diploma Form";
          viewUrl = `/view-diploma-pdf3/${form.id}/`;
          deleteHandler = `deleteForm(${form.id}, 'diploma')`;
          selectId = `statusSelect_diploma_${form.id}`;
        }

        const options = `
          <option value="Pending" ${form.status === "Pending" ? "selected" : ""}>Pending</option>
          <option value="Approved">Approve</option>
          <option value="Rejected">Reject</option>
          <option value="Cancelled">Cancel</option>
        `;

        const date = form.date_submitted || form.todays_date || form.today_date || "—";

        tbody.innerHTML += `
          <tr>
            <td>${form.name || form.employee_name}</td>
            <td>${date}</td>
            <td>${form.employee_id || form.user || "N/A"}</td>
            <td><a href="${viewUrl}" target="_blank" class="weee"><button>Open PDF</button></a></td>
            <td>${formType}</td>
            <td>
              <p>${form.status}</p>
              <select id="${selectId}">${options}</select>
            </td>
          </tr>
        `;

        // Add listener to status dropdown
        setTimeout(() => {
          const selectElement = document.getElementById(selectId);
          if (selectElement) {
            selectElement.addEventListener('change', function () {
              handleStatusChange(form.id, this.value, formType);
            });
          }
        }, 0);
      });
    }
    
  // Function to set cookies
function setCookie(name, value, days) {
  const d = new Date();
  d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000)); // Expiration time
  const expires = "expires=" + d.toUTCString();
  document.cookie = name + "=" + value + ";" + expires + ";path=/";
}

// Function to get cookies
function getCookie(name) {
  const nameEQ = name + "=";
  const ca = document.cookie.split(';');
  for (let i = 0; i < ca.length; i++) {
      let c = ca[i].trim();
      if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
  }
  return null;
}


// Function to delete cookies
function deleteCookie(name) {
  document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
}

function employeeload() {
  userLoad();
}
async function userLoad() {
  let currUser = localStorage.getItem("user_data");
  let currUserData = JSON.parse(currUser);
  managerRole = {
    id: '',
    level: '',
    role_name: '',
    department: ''
  }

      // Check if the value exists
  if (currUser !== null) {
    console.log("Retrieved value:", currUser);
    console.log("Retrieved value:", currUserData.id);
  } else {
    console.log("No value found for logged in user.");
  }
  await fetch(`/api/users/${currUserData.id}/`)
  .then(response => response.json())
  .then(data => {
    console.log("Retrieved data:", data.role.department);
    managerRole.id = data.role.id;
    managerRole.level = data.role.level;
    managerRole.role_name = data.role.role_name;
    managerRole.department = data.role.department;
  });
  console.log("Retrieved manager:",managerRole.id);

  await fetch("/api/get_userLoad/")
  .then(response => response.json())
  .then(data => {
    console.log(data);
      tbody = document.getElementById('employedTableBody');
      tbody.innerHTML = '';

      data.users.forEach(user => {
        employyeeLoad = `
          <tr>
              <td>${user.name}</td>
              <td>${user.id}</td>
              <td>${user.email}</td>
              <td>${user.role.department}</td>
          </tr>`

          if(user.role.id != 1 && user.role.department == managerRole.department && user.role.id != managerRole.id) {
            tbody.innerHTML += employyeeLoad;
            
          }

      })
  })
  .catch(error => {
      console.error('Error loading users:', error);
  });
}

function handleStatusChange(formId, newStatus, formType) {
      let endpoint = "";
      let payload = { status: newStatus };

      if (formType === "Payroll Form") {
        endpoint = `/api/payroll/${formId}/`;
      } else if (formType === "Reimburse Form") {
        endpoint = `/api/reimburse/${formId}/`;
      } else if (formType === "Change Address Form") {
        endpoint = `/api/address/${formId}/`;
      } else if (formType === "Diploma Form") {
        endpoint = `/api/diploma/${formId}/`;
      }

      fetch(endpoint, {
        method: "PATCH",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
                              "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
        .then(response => {
          if (!response.ok) throw new Error("Status update failed");
          return response.json();
        })
        .then(data => {
          console.log("Updated form status:", data);
          stuff(); // Refresh the table after update
        })
        .catch(error => {
          console.error("Error updating form status:", error);
        });
    }
</script>
</html>
