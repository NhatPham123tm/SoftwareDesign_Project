<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees Dashboard</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #ebebeb;
      color: black;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      background-color: #410445;
      color: white;
      padding: 20px;
    }

    .menu {
      list-style-type: none;
    }

    .menu li {
      margin-bottom: 20px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      padding: 13px;
      border-radius: 8px;
    }

    .menu a:hover,
    .menu a.active {
      background-color: #A5158C;
    }



    .fart {
      list-style-type: none;
      margin-bottom: 20px;
      color: white;
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 13px;
      border-radius: 8px;
    }


    .fart:hover
    {
      background-color: #34495e;
    }

    

    .main {
      flex: 1;
      padding: 30px;
    }

    .part {
      display: none;
    }

    .part.active {
      display: block;
    }

    table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background-color: white;
  border-radius: 10px;
  overflow: hidden;
}

thead {
  background-color: #2c3e50;
  color: white;
}

thead th {
  padding: 15px;
  text-align: left;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

tbody td {
  padding: 15px;
  border-bottom: 1px solid #eaeaea;
  font-size: 15px;
}


</style>
<body>
    <div class="container">
        <div class="sidebar">
          <div style="margin-bottom: 20px; font-size: 20px;">Employees</div>
          <ul class="menu">
            <li><a href="#dashboard" class="active">Dashboard</a></li>
            <li><a href="#employees" onclick="employeeload(); return false;">Coworkers</a></li>
            <li><a href="#forms" onclick="stuff(); return false;">Assigments</a></li>
            <li><a href="#">Logout</a></li>
          </ul>
          <a class="fart" href="{% url 'dashboard' %}">Home</a></li>
        </div>
    
        <div class="main">
          <div id="dashboard" class="part active">
            <h1 id="welcome"></h1>
          </div>

          <div id="employees" class="part">
            <h2>Coworkers Table</h2>
            <table>
              <thead>
                <tr>
                  <th>Coworkers ID</th>
                  <th>Coworkers Name</th>
                  <th>Coworkers Email</th>
                  <th>Department</th>
                  <th>ROLE</th>
                </tr>
              </thead>
              <tbody id="employedTableBody"></tbody>
            </table>
          
            <br>
          
            <h2>Users Table</h2>
            <table>
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>User Name</th>
                  <th>User Email</th>
                  <th>Status</th>
                  <th>Role</th>
                </tr>
              </thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>

          <div id="forms" class="part">
            <div id="trois-dept" class="">
              <h2>Assigments</h2>
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Date</th>
                    <th>User ID</th>
                    <th>PDF</th>
                    <th>PDF Type</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="PendingBody"></tbody>
              </table>
            </div>
          </div>
      </div>
    </div>
    </div>
</body>
<script>
    const links = document.querySelectorAll('.menu a');
    const contentSections = document.querySelectorAll('.part');

    links.forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();

        const targetId = this.getAttribute('href').substring(1);

        links.forEach(item => item.classList.remove('active'));
        this.classList.add('active');

        contentSections.forEach(section => {
          section.classList.remove('active');
        });

        const targetSection = document.getElementById(targetId);
        if (targetSection) {
          targetSection.classList.add('active');
        }
      });
    });


    document.addEventListener("DOMContentLoaded", function () {
            console.log("Fetching user data...");

            fetch('/api/microsoft-login/', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {

                console.log("Fetched user data:", data);
                if (!localStorage.getItem("access_token")){
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("user", JSON.stringify(data.user)); 
                }

                // Update the UI after data is fetched
                updateUserUI();
                updateUserData();
            })
            .catch(error => {
                //console.error("Error fetching user data:", error);
                updateUserUI();
            });
            updateUserData();
            
       })
        function updateUserUI() {
            console.log("Checking for user data in localStorage...");

            // Try fetching "user_data" first, if not available, fall back to "user"
            let userDataString = localStorage.getItem("user_data") || localStorage.getItem("user");
            
            if (userDataString) {
                try {
                    const userData = JSON.parse(userDataString);
                    if (userData && userData.name) {
                        document.getElementById("welcome").textContent = `Welcome, ${userData.name}!`;
                    }
                } catch (error) {
                    console.error("Error parsing user data:", error);
                }
            } else {
                console.warn("No user data found in localStorage.");
            }
        }

    
  // Function to set cookies
function setCookie(name, value, days) {
  const d = new Date();
  d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000)); // Expiration time
  const expires = "expires=" + d.toUTCString();
  document.cookie = name + "=" + value + ";" + expires + ";path=/";
}

// Function to get cookies
function getCookie(name) {
  const nameEQ = name + "=";
  const ca = document.cookie.split(';');
  for (let i = 0; i < ca.length; i++) {
      let c = ca[i].trim();
      if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
  }
  return null;
}


// Function to delete cookies
function deleteCookie(name) {
  document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
}

function employeeload() {
  userLoad();
}
async function userLoad() {
  let currUser = localStorage.getItem("user_data");
  let currUserData = JSON.parse(currUser);

  const managerRole = {
    id: '',
    level: '',
    role_name: '',
    department: ''
  };

  if (!currUserData) {
    console.log("No value found for logged in user.");
    return;
  }

  console.log("Retrieved user ID:", currUserData.id);

  await fetch(`/api/users/${currUserData.id}/`)
    .then(response => response.json())
    .then(data => {
      console.log("Retrieved role data:", data.role.department);
      managerRole.id = data.role.id;
      managerRole.level = data.role.level;
      managerRole.role_name = data.role.role_name;
      managerRole.department = data.role.department;
    });

  console.log("Retrieved manager role ID:", managerRole.id);

  await fetch("/api/get_userLoad/")
    .then(response => response.json())
    .then(data => {
      console.log(data);

      const empTable = document.getElementById('employedTableBody');
      const userTable = document.getElementById('userTableBody');
      empTable.innerHTML = '';
      userTable.innerHTML = '';

      data.users.forEach(user => {
        // Coworkers Table: Same department, same role, not admin
        if (
          user.role.id !== 1 &&
          user.role.department === managerRole.department &&
          user.role.id === managerRole.id
        ) {
          empTable.innerHTML += `
            <tr>
              <td>${user.id}</td>
              <td>${user.name}</td>
              <td>${user.email}</td>
              <td>${user.role.department}</td>
              <td>${user.role.role_name}</td>
            </tr>`;
        }

        // Users Table: Show all users
        if (
          user.role.id == 2
        ) {
          userTable.innerHTML += `
            <tr>
              <td>${user.id}</td>
              <td>${user.name}</td>
              <td>${user.email}</td>
              <td>${user.status}</td>
              <td>${user.role.role_name}</td>
            </tr>`;
        }
      });
    })
    .catch(error => {
      console.error('Error loading users:', error);
    });
}



</script>
</html>
